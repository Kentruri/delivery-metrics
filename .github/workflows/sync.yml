name: Daily sync

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the API to sync GitHub, Netlify and Forge
        env:
          API_ORIGIN: ${{ secrets.API_ORIGIN }}
          SYNC_API_KEY: ${{ secrets.SYNC_API_KEY }}
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 5 --retry-delay 20 --retry-all-errors --max-time 900 \
            -X POST "$API_ORIGIN/v1/sync" \
            -H "authorization: Bearer $SYNC_API_KEY"
